name: Unit tests

on:
  push:
    paths:
      - '**.go'
      - '.go-version'
      - 'go.mod'
      - 'go.sum'
      - 'GNUmakefile'
      - '.golangci.yml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - '.go-version'
      - 'go.mod'
      - 'go.sum'
      - 'GNUmakefile'
      - '.golangci.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  unit_tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Run unit tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ./internal/provider
